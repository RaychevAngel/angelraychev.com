<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Scalable meta-learning from hindsight</title>
  <desc id="desc">Select teaching signals by the improvement they cause in a student, then learn to assign those signals from completed experience.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#131313"/></marker></defs>
  <rect width="1200" height="630" fill="#fafaf8"/>
  <g font-family="Menlo, DejaVu Sans Mono, monospace" fill="#131313">
    <text x="64" y="65" font-size="20">Angel Ivanov Raychev</text>
    <text x="64" y="143" font-size="42" font-weight="700">Scalable meta-learning</text>
    <text x="64" y="198" font-size="42" font-weight="700">from hindsight</text>
    <text x="64" y="248" font-size="19" fill="#555">Learn what teaches—not just what explains.</text>
    <g fill="none" stroke="#131313" stroke-width="2">
      <rect x="64" y="318" width="310" height="128"/>
      <rect x="445" y="318" width="310" height="128"/>
      <rect x="826" y="318" width="310" height="128"/>
      <path d="M385 382H432" marker-end="url(#arrow)"/>
      <path d="M766 382H813" marker-end="url(#arrow)"/>
    </g>
    <g text-anchor="middle">
      <text x="219" y="365" font-size="19" font-weight="700">COMPLETED EXPERIENCE</text>
      <text x="219" y="402" font-size="17" fill="#555">Task · attempt · feedback</text>
      <text x="600" y="365" font-size="19" font-weight="700">TEACHING DISTRIBUTIONS</text>
      <text x="600" y="402" font-size="17" fill="#555">Selected by student gain</text>
      <text x="981" y="365" font-size="19" font-weight="700">CAUSAL STUDENT UPDATE</text>
      <text x="981" y="402" font-size="17" fill="#555">Evaluate on new tasks</text>
    </g>
    <text x="64" y="513" font-size="18" fill="#555">Contextual help ≠ distribution fitting ≠ retained learning</text>
    <text x="64" y="588" font-size="17" fill="#555">angelraychev.com</text>
  </g>
</svg>
