<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc">
  <title id="title">Joining agent outcomes to the experience that produced them</title>
  <desc id="desc">Repeated attempts use one task and a captured agent snapshot. Each attempt supplies an assessment and captured native model calls. Runtime correlates and qualifies these records before deriving relative advantages and learning datums. Forward and backward contributions and an ordered optimizer step produce the next sampler and checkpoint. The next batch keeps the same harness and uses the successor model.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
  <rect width="1000" height="740" fill="#fff"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#111">
    <text x="40" y="42" font-size="14" letter-spacing="1.7">FROM TASK EXPERIENCE TO LEARNING</text>
    <text x="40" y="79" font-size="25" font-weight="700">The outcome and its generating evidence meet.</text>
    <text x="40" y="109" font-size="16" fill="#555">One captured model S₀ and harness H for the current batch.</text>
    <g fill="none" stroke="#111" stroke-width="1.5">
      <rect x="40" y="228" width="240" height="182"/>
      <rect x="365" y="150" width="275" height="132"/>
      <rect x="365" y="330" width="275" height="158"/>
      <rect x="715" y="228" width="245" height="182"/>
      <path d="M280 274H320V216H354" marker-end="url(#arrow)"/>
      <path d="M280 364H320V409H354" marker-end="url(#arrow)"/>
      <path d="M640 216H678V274H704" marker-end="url(#arrow)"/>
      <path d="M640 409H678V364H704" marker-end="url(#arrow)"/>
      <rect x="715" y="550" width="245" height="140"/>
      <rect x="365" y="550" width="275" height="140"/>
      <rect x="40" y="550" width="240" height="140"/>
      <path d="M838 410V539" marker-end="url(#arrow)"/>
      <path d="M715 616H651" marker-end="url(#arrow)"/>
      <path d="M365 616H291" marker-end="url(#arrow)"/>
      <path d="M40 616H20V319H29" marker-end="url(#arrow)"/>
    </g>
    <text x="60" y="259" font-size="13" fill="#555">TASK GROUP</text>
    <text x="60" y="295" font-size="18" font-weight="700">Repeated attempts</text>
    <text x="60" y="331" font-size="16">One pinned task</text>
    <text x="60" y="358" font-size="16">Same S₀ + H</text>
    <text x="60" y="389" font-size="15" fill="#555">Distinct trial IDs</text>
    <text x="385" y="180" font-size="13" fill="#555">ASSESSMENT</text>
    <text x="385" y="215" font-size="18" font-weight="700">Task-level outcome</text>
    <text x="385" y="250" font-size="16">Verifier or judge</text>
    <text x="385" y="360" font-size="13" fill="#555">CAPTURED NATIVE CALLS</text>
    <text x="385" y="395" font-size="18" font-weight="700">Model-native data</text>
    <text x="385" y="430" font-size="16">Prompt + generated tokens</text>
    <text x="385" y="459" font-size="16">Generation logprobs</text>
    <text x="735" y="259" font-size="13" fill="#555">JOIN + QUALIFY</text>
    <text x="735" y="295" font-size="18" font-weight="700">Bind + validate</text>
    <text x="735" y="331" font-size="16">Originating trial</text>
    <text x="735" y="358" font-size="16">Reward + token data</text>
    <text x="735" y="389" font-size="14" fill="#555">Qualify before centering</text>
    <text x="735" y="580" font-size="13" fill="#555">PREPARE LEARNING</text>
    <text x="735" y="615" font-size="18" font-weight="700">Relative advantages</text>
    <text x="735" y="651" font-size="16">Action-token inputs</text>
    <text x="385" y="580" font-size="13" fill="#555">MODEL COMPUTATION</text>
    <text x="385" y="615" font-size="18" font-weight="700">Forward / backward</text>
    <text x="385" y="651" font-size="16">Batch optimizer step</text>
    <text x="60" y="580" font-size="13" fill="#555">CONTINUE WITH SAME HARNESS</text>
    <text x="60" y="615" font-size="18" font-weight="700">Save model state</text>
    <text x="60" y="646" font-size="16">Sampler + checkpoint</text>
    <text x="60" y="670" font-size="16">Next batch: S₁ + H</text>
    <text x="40" y="719" font-size="15" fill="#555">Qualification precedes reward centering. An assessment alone is not training evidence.</text>
  </g>
</svg>
