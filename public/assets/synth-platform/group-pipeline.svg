<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Overlap independent work while preserving the update boundary</title>
  <desc id="desc">Three groups use the same model snapshot. A fast group begins evidence preparation and forward/backward submission while a slow group is still sampling. An optimizer step is enqueued after the batch contributions, and the synchronized new sampler is used for the next batch. Bar lengths illustrate ordering, not measured time.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
  <rect width="1000" height="480" fill="#fff"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#111">
    <text x="40" y="41" font-size="14" letter-spacing="1.4">PIPELINED PREPARATION, SYNCHRONIZED UPDATES</text>
    <text x="40" y="79" font-size="24" font-weight="700">A ready group can begin learning work immediately.</text>
    <text x="40" y="110" font-size="16" fill="#555">All groups capture the same policy S₀. Bar lengths are schematic.</text>

    <g font-size="15">
      <rect x="174" y="137" width="17" height="15" fill="#fff" stroke="#111"/><text x="201" y="150">Sample</text>
      <rect x="302" y="137" width="17" height="15" fill="#ddd" stroke="#111"/><text x="329" y="150">Prepare</text>
      <rect x="449" y="137" width="17" height="15" fill="#111"/><text x="476" y="150">Submit F/B</text>
    </g>
    <g font-size="18"><text x="40" y="213">Group A</text><text x="40" y="283">Group B</text><text x="40" y="353">Group C</text></g>
    <g stroke="#111" stroke-width="1.3">
      <rect x="174" y="185" width="146" height="43" fill="#fff"/><rect x="320" y="185" width="90" height="43" fill="#ddd"/><rect x="410" y="185" width="90" height="43" fill="#111"/>
      <rect x="174" y="255" width="236" height="43" fill="#fff"/><rect x="410" y="255" width="90" height="43" fill="#ddd"/><rect x="500" y="255" width="90" height="43" fill="#111"/>
      <rect x="174" y="325" width="356" height="43" fill="#fff"/><rect x="530" y="325" width="90" height="43" fill="#ddd"/><rect x="620" y="325" width="90" height="43" fill="#111"/>
      <path d="M500 207H730M590 277H730M710 347H730" fill="none" stroke="#888" stroke-dasharray="4 5"/>
      <path d="M745 170V380" fill="none" stroke-dasharray="5 5"/>
      <rect x="785" y="197" width="175" height="73" fill="#f5f5f5"/>
      <path d="M753 233H774" fill="none" marker-end="url(#arrow)"/>
      <path d="M872 270V292" fill="none" marker-end="url(#arrow)"/>
      <rect x="785" y="304" width="175" height="73" fill="#fff"/>
    </g>
    <g font-size="17" text-anchor="middle"><text x="872" y="228" font-weight="700">Optimizer</text><text x="872" y="251">step</text><text x="872" y="336" font-weight="700">Sampler S₁</text><text x="872" y="359">Next batch</text></g>
    <text x="174" y="415" font-size="16">Fast-group preparation overlaps slow-group sampling.</text>
    <text x="174" y="444" font-size="15" fill="#555">The update follows submission of the batch’s contributions.</text>
  </g>
</svg>
