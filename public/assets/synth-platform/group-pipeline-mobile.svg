<svg xmlns="http://www.w3.org/2000/svg" width="420" height="770" viewBox="0 0 420 770" role="img" aria-labelledby="title desc">
  <title id="title">Pipelined group work with a shared optimizer boundary</title>
  <desc id="desc">The three groups capture one policy. Fast groups prepare evidence and submit learning work while slower groups continue sampling. The optimizer follows the batch contributions and the next batch uses its new sampler. Bars are conceptual, not a time measurement.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
  <rect width="420" height="770" fill="#fff"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#111">
    <text x="24" y="37" font-size="18" letter-spacing="1">PIPELINED GROUP WORK</text>
    <text x="24" y="76" font-size="24" font-weight="700">Overlap independent work.</text>
    <text x="24" y="108" font-size="24" font-weight="700">Keep one update boundary.</text>
    <text x="24" y="145" font-size="18" fill="#555">Same policy S₀ for all groups.</text>

    <g font-size="18">
      <rect x="24" y="177" width="16" height="15" fill="#fff" stroke="#111"/><text x="49" y="190">Sample</text>
      <rect x="144" y="177" width="16" height="15" fill="#ddd" stroke="#111"/><text x="169" y="190">Prepare</text>
      <rect x="278" y="177" width="16" height="15" fill="#111"/><text x="303" y="190">Enqueue</text>
    </g>
    <g font-size="18"><text x="24" y="238">Group A</text><text x="24" y="338">Group B</text><text x="24" y="438">Group C</text></g>
    <g stroke="#111" stroke-width="1.2">
      <rect x="24" y="255" width="104" height="35" fill="#fff"/><rect x="128" y="255" width="56" height="35" fill="#ddd"/><rect x="184" y="255" width="56" height="35" fill="#111"/>
      <rect x="24" y="355" width="160" height="35" fill="#fff"/><rect x="184" y="355" width="56" height="35" fill="#ddd"/><rect x="240" y="355" width="56" height="35" fill="#111"/>
      <rect x="24" y="455" width="216" height="35" fill="#fff"/><rect x="240" y="455" width="56" height="35" fill="#ddd"/><rect x="296" y="455" width="56" height="35" fill="#111"/>
      <path d="M240 273H376M296 373H376M352 473H376" fill="none" stroke-dasharray="4 5"/>
      <path d="M376 255V528H111V548" fill="none" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
      <rect x="24" y="560" width="175" height="88" fill="#f5f5f5"/>
      <rect x="245" y="560" width="151" height="88" fill="#fff"/>
      <path d="M199 604H234" fill="none" marker-end="url(#arrow)"/>
    </g>
    <text x="111" y="595" text-anchor="middle" font-size="18" font-weight="700">Optimizer</text>
    <text x="111" y="624" text-anchor="middle" font-size="18">step</text>
    <text x="320" y="595" text-anchor="middle" font-size="18" font-weight="700">Sampler S₁</text>
    <text x="320" y="624" text-anchor="middle" font-size="18">Next batch</text>
    <text x="24" y="695" font-size="18">Ready groups submit learning work</text>
    <text x="24" y="721" font-size="18">while other groups are sampling.</text>
    <text x="24" y="749" font-size="18" fill="#555">Schematic; not measured time.</text>
  </g>
</svg>
