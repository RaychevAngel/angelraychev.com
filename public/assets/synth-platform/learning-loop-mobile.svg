<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1240" viewBox="0 0 420 1240" role="img" aria-labelledby="title desc">
  <title id="title">The agent learning loop</title>
  <desc id="desc">Capture the model and harness. Sample repeated task attempts; join task assessments to exact tokens and log probabilities; submit forward and backward contributions; apply the batch update; save a sampler and checkpoint; continue with the updated model and unchanged harness.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
  <rect width="420" height="1240" fill="#fff"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#111">
    <text x="24" y="37" font-size="18" letter-spacing="1.4">THE LEARNING LOOP</text>
    <text x="24" y="76" font-size="24" font-weight="700">Task outcomes become</text>
    <text x="24" y="108" font-size="24" font-weight="700">model updates.</text>
    <text x="24" y="144" font-size="18" fill="#555">Model S₀ + fixed harness H.</text>
    <g fill="none" stroke="#111" stroke-width="1.4">
      <rect x="24" y="178" width="354" height="130"/>
      <rect x="24" y="353" width="354" height="145"/>
      <rect x="24" y="543" width="354" height="130"/>
      <rect x="24" y="718" width="354" height="110"/>
      <rect x="24" y="873" width="354" height="110"/>
      <rect x="24" y="1028" width="354" height="110"/>
      <path d="M201 308V341" marker-end="url(#arrow)"/>
      <path d="M201 498V531" marker-end="url(#arrow)"/>
      <path d="M201 673V706" marker-end="url(#arrow)"/>
      <path d="M201 828V861" marker-end="url(#arrow)"/>
      <path d="M201 983V1016" marker-end="url(#arrow)"/>
      <path d="M378 1083H399V243H389" marker-end="url(#arrow)"/>
    </g>
    <text x="42" y="207" font-size="18" fill="#555">01 / SAMPLE THE AGENT</text>
    <text x="42" y="240" font-size="20" font-weight="700">Repeated task attempts</text>
    <text x="42" y="275" font-size="18">Agent + tools + environment</text>

    <text x="42" y="382" font-size="18" fill="#555">02 / PREPARE LEARNING</text>
    <text x="42" y="415" font-size="20" font-weight="700">Group-relative advantages</text>
    <text x="42" y="448" font-size="18">Task assessments, exact tokens</text>
    <text x="42" y="475" font-size="18">and behavior-policy logprobs</text>

    <text x="42" y="572" font-size="18" fill="#555">03 / ACCUMULATE</text>
    <text x="42" y="605" font-size="20" font-weight="700">Submit forward/backward</text>
    <text x="42" y="640" font-size="18">Learning work for the batch</text>

    <text x="42" y="747" font-size="18" fill="#555">04 / UPDATE</text>
    <text x="42" y="780" font-size="20" font-weight="700">Ordered optimizer step</text>
    <text x="42" y="809" font-size="18">After batch contributions</text>

    <text x="42" y="902" font-size="18" fill="#555">05 / SAVE MODEL STATE</text>
    <text x="42" y="935" font-size="20" font-weight="700">Sampler + checkpoint</text>
    <text x="42" y="964" font-size="18">Usable saved model state</text>

    <text x="42" y="1057" font-size="18" fill="#555">06 / CONTINUE</text>
    <text x="42" y="1090" font-size="20" font-weight="700">New model S₁ + same H</text>
    <text x="42" y="1119" font-size="18">Next batch or evaluation</text>
    <text x="24" y="1182" font-size="18" fill="#555">One trajectory can contain many</text>
    <text x="24" y="1208" font-size="18" fill="#555">generating model interactions.</text>
  </g>
</svg>
