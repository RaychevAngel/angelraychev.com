<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1450" viewBox="0 0 420 1450" role="img" aria-labelledby="title desc">
  <title id="title">Joining task outcomes with captured native-agent experience</title>
  <desc id="desc">Repeated attempts on one pinned task use the captured agent snapshot. Task assessments and actual native-call tokens are correlated to their originating trials and qualified before reward centering. Relative advantages and action-token inputs supply learning contributions. The batch optimizer step yields the next sampler and checkpoint, keeping the harness fixed.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
  <rect width="420" height="1450" fill="#fff"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#111">
    <text x="30" y="32" font-size="14" letter-spacing="1">TASK EXPERIENCE → LEARNING</text>
    <text x="30" y="70" font-size="23" font-weight="700">Outcomes meet their</text>
    <text x="30" y="100" font-size="23" font-weight="700">generating evidence.</text>
    <text x="30" y="132" font-size="17" fill="#555">Same S₀ + H for the current batch.</text>
    <g fill="none" stroke="#111" stroke-width="1.5">
      <rect x="50" y="160" width="320" height="145"/>
      <path d="M210 305V332H112V349" marker-end="url(#arrow)"/>
      <path d="M210 332H308V349" marker-end="url(#arrow)"/>
      <rect x="25" y="360" width="175" height="190"/>
      <rect x="220" y="360" width="175" height="190"/>
      <path d="M112 550V586H210V609" marker-end="url(#arrow)"/>
      <path d="M308 550V586H210"/>
      <rect x="50" y="620" width="320" height="175"/>
      <path d="M210 795V824" marker-end="url(#arrow)"/>
      <rect x="50" y="835" width="320" height="125"/>
      <path d="M210 960V1009" marker-end="url(#arrow)"/>
      <rect x="50" y="1020" width="320" height="125"/>
      <path d="M210 1145V1194" marker-end="url(#arrow)"/>
      <rect x="50" y="1205" width="320" height="125"/>
      <path d="M50 1268H12V232H39" marker-end="url(#arrow)"/>
    </g>
    <g text-anchor="middle">
      <text x="210" y="190" font-size="14" fill="#555">TASK GROUP</text>
      <text x="210" y="224" font-size="20" font-weight="700">Repeated attempts</text>
      <text x="210" y="255" font-size="18">One pinned task · S₀ + H</text>
      <text x="210" y="285" font-size="17" fill="#555">Distinct trial identities</text>
      <text x="112" y="391" font-size="13" fill="#555">ASSESSMENT</text>
      <text x="112" y="430" font-size="19" font-weight="700">Task-level</text>
      <text x="112" y="456" font-size="19" font-weight="700">outcome</text>
      <text x="112" y="503" font-size="16">Verifier / judge</text>
      <text x="308" y="391" font-size="13" fill="#555">NATIVE CALLS</text>
      <text x="308" y="430" font-size="19" font-weight="700">Actual tokens</text>
      <text x="308" y="470" font-size="16">Prompt + output</text>
      <text x="308" y="497" font-size="16">token IDs</text>
      <text x="308" y="524" font-size="16">+ logprobs</text>
      <text x="210" y="650" font-size="14" fill="#555">JOIN + QUALIFY</text>
      <text x="210" y="687" font-size="20" font-weight="700">Bind + validate</text>
      <text x="210" y="719" font-size="18">Originating trial</text>
      <text x="210" y="746" font-size="18">Reward + token evidence</text>
      <text x="210" y="775" font-size="16" fill="#555">Before reward centering</text>
      <text x="210" y="865" font-size="14" fill="#555">PREPARE LEARNING</text>
      <text x="210" y="904" font-size="20" font-weight="700">Relative advantages</text>
      <text x="210" y="936" font-size="18">Action-token inputs</text>
      <text x="210" y="1050" font-size="14" fill="#555">MODEL COMPUTATION</text>
      <text x="210" y="1089" font-size="20" font-weight="700">Forward / backward</text>
      <text x="210" y="1121" font-size="18">Batch optimizer step</text>
      <text x="210" y="1235" font-size="14" fill="#555">CONTINUE WITH SAME HARNESS</text>
      <text x="210" y="1274" font-size="20" font-weight="700">Sampler + checkpoint</text>
      <text x="210" y="1306" font-size="18">Next batch: S₁ + same H</text>
    </g>
    <text x="30" y="1390" font-size="17" fill="#555">An assessment alone is not</text>
    <text x="30" y="1418" font-size="17" fill="#555">training evidence.</text>
  </g>
</svg>
