<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">A managed agent run across control, execution, inference and learning</title>
  <desc id="desc">The Synth CLI submits work through Gateway, which handles authentication, admission and durable metadata in PostgreSQL. Runtime coordinates independent task trials. Native agents and tools operate in task sandboxes and call their model through Proxy and an inference provider. Proxy writes large interaction evidence directly to object storage, which Runtime can read. Runtime coordinates Tinker training and obtains the next sampler. Solid arrows show commands and model calls; dotted arrows show bulk evidence. This is a logical responsibility diagram, not a physical deployment topology.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111;font-size:19px;font-weight:400}
    .small{font-size:17px;fill:#444}.heading{font-size:19px;font-weight:500}.node{fill:#fff;stroke:#222;stroke-width:1.5}.group{fill:#fff;stroke:#777;stroke-width:1.3}.rule{fill:none;stroke:#bbb;stroke-width:1}
    .flow{fill:none;stroke:#222;stroke-width:1.8;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.data{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round;marker-end:url(#arrow)}
  </style>
  <rect width="1000" height="720" fill="#fff"/>
  <text x="40" y="31" class="heading">CONTROL · EXECUTION · LEARNING</text>

  <!-- One accepted request fans out into independent trials. -->
  <path class="flow" d="M200 138 H294"/>
  <text x="223" y="119" class="small">submit</text>
  <path class="flow both" d="M534 138 H660"/>
  <text x="597" y="119" text-anchor="middle" class="small">run / state</text>
  <rect class="node" x="40" y="96" width="160" height="86"/>
  <text x="120" y="133" text-anchor="middle" class="heading">synth CLI</text>
  <text x="120" y="160" text-anchor="middle" class="small">operator</text>
  <rect class="node" x="294" y="96" width="240" height="86"/>
  <text x="414" y="131" text-anchor="middle" class="heading">Gateway</text>
  <text x="414" y="159" text-anchor="middle" class="small">auth · admission</text>
  <rect class="node" x="660" y="96" width="300" height="116"/>
  <text x="810" y="125" text-anchor="middle" class="heading">agent-rl-runtime</text>
  <text x="810" y="152" text-anchor="middle" class="small">execution + learning</text>
  <path class="rule" d="M680 166 H940"/>
  <text x="810" y="193" text-anchor="middle" class="small">Harbor execution adapter</text>

  <path class="flow both" d="M414 182 V260"/>
  <text x="436" y="224" class="small">run metadata</text>
  <rect class="node" x="294" y="260" width="240" height="76"/>
  <text x="414" y="292" text-anchor="middle" class="heading">PostgreSQL</text>
  <text x="414" y="319" text-anchor="middle" class="small">durable authority</text>

  <path class="flow" d="M810 212 V260"/>
  <text x="830" y="243" class="small">trials</text>
  <rect class="group" x="660" y="260" width="300" height="208"/>
  <text x="810" y="289" text-anchor="middle" class="heading">Independent task trials</text>
  <rect class="node" x="670" y="309" width="88" height="104"/>
  <rect class="node" x="766" y="309" width="88" height="104"/>
  <rect class="node" x="862" y="309" width="88" height="104"/>
  <text x="714" y="335" text-anchor="middle" class="small">trial 1</text>
  <text x="810" y="335" text-anchor="middle" class="small">trial 2</text>
  <text x="906" y="335" text-anchor="middle" class="small">trial n</text>
  <text x="714" y="366" text-anchor="middle">agent</text>
  <text x="810" y="366" text-anchor="middle">agent</text>
  <text x="906" y="366" text-anchor="middle">agent</text>
  <text x="714" y="394" text-anchor="middle" class="small">+ tools</text>
  <text x="810" y="394" text-anchor="middle" class="small">+ tools</text>
  <text x="906" y="394" text-anchor="middle" class="small">+ tools</text>
  <text x="810" y="444" text-anchor="middle" class="small">assessment when selected</text>

  <!-- Native tool execution stays in the task; only model calls cross Proxy. -->
  <path class="flow both" d="M660 365 H590 V443 H534"/>
  <text x="534" y="356" class="small">model calls</text>
  <path class="flow both" d="M294 443 H240"/>
  <rect class="node" x="294" y="400" width="240" height="86"/>
  <text x="414" y="434" text-anchor="middle" class="heading">Proxy</text>
  <text x="414" y="463" text-anchor="middle" class="small">protocol + evidence</text>
  <rect class="node" x="40" y="400" width="200" height="86"/>
  <text x="140" y="434" text-anchor="middle" class="heading">Model provider</text>
  <text x="140" y="463" text-anchor="middle" class="small">inference</text>

  <!-- Bulk evidence bypasses Gateway. -->
  <path class="data" d="M414 486 V560"/>
  <text x="435" y="530" class="small">bulk evidence</text>
  <rect class="node" x="294" y="560" width="240" height="88"/>
  <text x="414" y="596" text-anchor="middle" class="heading">Object storage</text>
  <text x="414" y="624" text-anchor="middle" class="small">traces + artifacts</text>
  <path class="data" d="M294 604 H20 V64 H810 V96"/>
  <rect x="568" y="51" width="210" height="25" fill="#fff"/>
  <text x="580" y="70" class="small">stored evidence</text>

  <!-- Training compute is a separate service from task execution. -->
  <path class="flow both" d="M960 138 H982 V604 H960"/>
  <rect class="node" x="660" y="560" width="300" height="88"/>
  <text x="810" y="595" text-anchor="middle" class="heading">Optional learning</text>
  <text x="810" y="624" text-anchor="middle" class="small">Tinker: update ↔ sampler</text>
  <text x="810" y="531" text-anchor="middle" class="small">model state, not task compute</text>

  <path d="M40 686 H81" stroke="#222" stroke-width="1.8"/>
  <text x="93" y="692" class="small">commands / model calls</text>
  <path d="M382 686 H423" stroke="#555" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
  <text x="435" y="692" class="small">bulk evidence</text>
  <text x="960" y="692" text-anchor="end" class="small">Logical responsibilities</text>
</svg>
