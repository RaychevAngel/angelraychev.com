<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Model specialization and training agents</title>
  <desc id="desc">A researcher improves the training agent, which constructs and trains a specialist model. Documents, executable tasks and feedback connect the three levels.</desc>
  <rect width="1200" height="630" fill="#fafaf8"/>
  <g font-family="Menlo, DejaVu Sans Mono, monospace" fill="#131313">
    <text x="64" y="65" font-size="20">Angel Ivanov Raychev</text>
    <text x="64" y="143" font-size="42" font-weight="700">Model specialization</text>
    <text x="64" y="198" font-size="42" font-weight="700">and training agents</text>
    <text x="64" y="248" font-size="19" fill="#555">Documents · executable tasks · distillation · research loops</text>
    <rect x="64" y="298" width="1072" height="238" fill="none" stroke="#131313" stroke-width="2"/>
    <text x="88" y="334" font-size="20" font-weight="700">RESEARCHER</text>
    <text x="88" y="365" font-size="16" fill="#555">Improve the reusable process</text>
    <rect x="468" y="320" width="644" height="192" fill="none" stroke="#999"/>
    <text x="490" y="354" font-size="20" font-weight="700">TRAINING AGENT</text>
    <text x="490" y="383" font-size="16" fill="#555">Construct data, train, assess</text>
    <rect x="738" y="411" width="352" height="78" fill="#131313"/>
    <text x="759" y="442" font-size="18" font-weight="700" fill="#fafaf8">SPECIALIST MODEL</text>
    <text x="759" y="470" font-size="15" fill="#fafaf8">Learn the intended work</text>
    <text x="64" y="588" font-size="17" fill="#555">angelraychev.com</text>
  </g>
</svg>
