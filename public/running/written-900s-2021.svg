<title id="title">Written 5×900 m sessions, March–May 2021</title>
<desc id="description">Each horizontal line shows the minimum and maximum of five written repetition times; a dot shows their arithmetic mean. Open dots mark three sets with extra recovery. The questioned 19 March set is not plotted. The 30 April set has the fastest written mean, 2 minutes 48.2 seconds, with a two-second range.</desc>
